[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "albert-api-wrapper"
version = "0.1.0"
description = "Wrapper Python pour l'API Albert"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
  "ruff",
  "pytest>=9.0.1",
]
web = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.scripts]
albert-ui = "web_ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/albert_wrapper", "src/web_ui"]


[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
